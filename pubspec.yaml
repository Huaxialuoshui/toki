name: toki
description: "Toki - 本地优先的 AI 日历提醒助手 (local-first AI calendar & reminder assistant)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Phase 1: state management, routing, lightweight settings storage, i18n.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
