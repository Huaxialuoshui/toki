name: toki
description: "Toki - 本地优先的 AI 日历提醒助手 (local-first AI calendar & reminder assistant)."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Phase 1: state management, routing, lightweight settings storage, i18n.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  # Phase 2: 本地数据库。版本上限受 Flutter 3.27.2 / Dart 3.6.1 约束：
  # drift 2.29+ 需要 build 3.x，而使用 build 3.x 的 build_runner 要求 Dart 3.7+，
  # 因此固定在 drift 2.28.x + drift_dev 2.28.0 + build_runner 2.4.15。
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.1
  dio: ^5.11.1
  image_picker: 1.2.0
  # 自定义应用图标（Windows）：需要 toNativeUtf16 / malloc 调 Win32 的
  # FindWindowW / LoadImageW / SendMessageW。纯 Dart，且早已是传递依赖。
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1
  drift_dev: ^2.28.0
  build_runner: ^2.4.15
  sqlite3: ^2.9.4
  meta: ^1.15.0

flutter:
  uses-material-design: true
  generate: true
